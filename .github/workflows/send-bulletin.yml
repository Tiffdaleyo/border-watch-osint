# The reviewer has checked the Monday draft bulletin: press "Run workflow" to email it to the team (MAIL_TO) and
# save its PDF on the website. It is the same week as the draft (the 7 days to the latest Monday), with any
# corrections made in reviews.yaml since the draft.
name: send-bulletin

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Bulletin date (YYYY-MM-DD). Leave empty for the latest Monday's bulletin"
        default: ""

permissions:
  contents: write

concurrency:
  group: border-watch-osint
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rebuild the reviewed week with the latest corrections
        run: |
          d="${{ github.event.inputs.date }}"
          [ -n "$d" ] || d="$(date -u -d "$(( $(date -u +%u) - 1 )) days ago" +%F)"
          echo "BULLETIN_DATE=$d" >> "$GITHUB_ENV"
          python -u run.py --rebuild --draft --bulletin-date "$d"
      - name: Make the PDF and email it to the team
        run: python -u tools/send_weekly.py --team
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Save the PDF
        run: |
          git config user.name  "border-watch-osint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/bulletin.pdf
          git diff --cached --quiet || git commit -m "Weekly bulletin sent $(date -u +%F)"
          git push || (git pull --rebase -X theirs origin main && git push)
