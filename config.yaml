# =====================================================================
#  BORDER WATCH OSINT - settings
#  Everything you may want to change is in this file. Lines starting
#  with # are notes and are ignored by the program.
# =====================================================================

site:
  title: "Border Watch OSINT"
  subtitle: "Open-source news on migration, travel documents, trafficking, smuggling, cargo and border security, worldwide with a Caribbean focus"
  url: "https://tiffdaleyo.github.io/border-watch-osint/"   # used for links in emails
  home_country: "Jamaica"          # events mentioning this country are highlighted
  home_places: ["Jamaica", "Kingston", "Montego Bay", "Norman Manley", "Sangster", "Ocho Rios", "Negril", "PICA"]
  region_name: "Caribbean"
  region_words: ["Caribbean", "CARICOM", "IMPACS", "Caribe", "Caraibes", "West Indies"]   # these words also count as the region
  region_countries: ["Jamaica", "Haiti", "Dominican Republic", "Cuba", "Bahamas", "Turks and Caicos Islands",
                     "Cayman Islands", "Trinidad and Tobago", "Barbados", "Guyana", "Suriname", "Belize",
                     "Saint Lucia", "Grenada", "Saint Vincent and the Grenadines", "Antigua and Barbuda",
                     "Saint Kitts and Nevis", "Dominica", "Puerto Rico", "Aruba", "Curacao",
                     "British Virgin Islands", "US Virgin Islands", "Anguilla", "Montserrat", "Bermuda"]

run:
  lookback_days: 2       # how far back each daily run searches (2 gives a safe overlap)
  report_days: 180       # how much history the website shows
  delay_seconds: 1.5     # pause between searches, to be polite to the news services
  search_budget_minutes: 20   # stop starting new searches after this, so the run always finishes and saves
  read_full_articles: true    # open each report's article and pull out the facts (only facts are kept, never the text)
  read_budget_minutes: 8      # time allowed for reading articles in each run
  read_limit: 400             # most articles read per run; older unread ones are caught up in later runs

sources:
  google_news:
    enabled: true
    # Each edition is one Google News country and language. More editions = wider coverage.
    editions:
      - {lang: en, hl: en-US,  gl: US, ceid: "US:en"}
      - {lang: en, hl: en-GB,  gl: GB, ceid: "GB:en"}
      - {lang: en, hl: en-CA,  gl: CA, ceid: "CA:en"}
      - {lang: en, hl: en-NG,  gl: NG, ceid: "NG:en"}
      - {lang: es, hl: es-419, gl: MX, ceid: "MX:es-419"}
      - {lang: es, hl: es-419, gl: CO, ceid: "CO:es-419"}
      - {lang: es, hl: es,     gl: ES, ceid: "ES:es"}
      - {lang: fr, hl: fr,     gl: FR, ceid: "FR:fr"}
      - {lang: pt, hl: pt-BR,  gl: BR, ceid: "BR:pt-419"}
      - {lang: nl, hl: nl,     gl: NL, ceid: "NL:nl"}      # Netherlands, and Dutch news from Aruba, Curacao, Sint Maarten, Suriname
      - {lang: de, hl: de,     gl: DE, ceid: "DE:de"}
      - {lang: it, hl: it,     gl: IT, ceid: "IT:it"}
    queries:
      en: ["fake passports seized", "forged passport arrested airport", "fraudulent passport arrested",
           "passport fraud ring", "counterfeit visas seized", "visa fraud arrested", "identity fraud passport",
           "impostor passport airport", "migrant smuggling arrested", "human smuggling airport arrested",
           "human trafficking airport intercepted", "fake documents migrants arrested",
           "citizenship by investment fraud", "Jamaica passport fraud", "Jamaica immigration arrested",
           "Caribbean human smuggling", "fraudulent travel documents",
           # irregular migration trends
           "irregular migration", "migrants intercepted", "migrant boat intercepted", "Haitian migrants interdicted",
           "Darien Gap migrants", "Caribbean migration", "migrant arrivals rise",
           # visa and entry rules
           "new visa requirement", "visa requirement Jamaica", "visa-free travel", "visa waiver", "visa restrictions",
           "travel ban", "entry requirements", "ETIAS", "Entry/Exit System", "electronic travel authorisation",
           "UK visa Jamaica", "Canada visa Jamaica", "US visa policy", "Schengen visa",
           # citizenship
           "citizenship fraud", "citizenship revoked", "citizenship by investment", "naturalisation fraud",
           # INTERPOL and watch lists
           "Interpol red notice arrested", "Interpol operation migrant smuggling", "Interpol stolen passports",
           "fugitive arrested at airport", "extradited Jamaica", "watch list airport",
           # deportation and border security
           "deportees Jamaica", "deportation flight Caribbean", "PICA Jamaica", "border security Caribbean",
           "CARICOM IMPACS",
           # drug trafficking through airports and ports
           "cocaine seized airport", "drug mule arrested airport", "swallowed cocaine pellets", "drugs found in luggage",
           "cocaine seized container port", "Jamaica cocaine seized", "ganja seized airport Jamaica",
           "Caribbean drug trafficking route", "cocaine Caribbean Europe seized",
           # cash couriers
           "undeclared cash seized airport", "cash courier arrested", "currency smuggling airport",
           # firearms
           "firearms seized port Jamaica", "gun smuggling Jamaica", "ammunition seized airport", "guns shipped barrel Jamaica",
           "firearms trafficking Caribbean",
           # terrorism-related travel and sanctions
           "terror suspect arrested airport", "foreign terrorist fighters travel", "sanctions evasion passenger",
           # aviation security
           "stowaway airport", "airport worker arrested smuggling", "airport security breach", "baggage handler arrested drugs",
           # wildlife
           "wildlife smuggling airport", "exotic animals smuggled luggage",
           # health-related travel rules
           "outbreak travel restrictions", "airport health screening", "entry requirements vaccination",
           # cargo operations
           "air cargo drugs seized", "container seized cocaine", "misdeclared shipment customs", "contraband seized customs Jamaica",
           "Kingston Wharves seized", "courier package drugs seized", "free zone transshipment seized",
           # supporting-document, digital identity and application fraud
           "fake bank statements visa", "fake supporting documents visa application", "deepfake identity fraud passport",
           "face morphing passport photo", "fake e-visa website scam", "sham marriage immigration arrested",
           "fake immigration consultant arrested",
           # corruption and insider facilitation
           "customs officer arrested bribe", "immigration officer arrested bribery", "corrupt border officials smuggling",
           # human trafficking investigations and victim assistance
           "human trafficking victims rescued", "forced labour trafficking arrested", "trafficking Caribbean victims",
           # border technology
           "e-gates airport biometric", "biometric border control"]
      es: ["cocaína incautada aeropuerto", "contenedor cocaína incautado", "armas incautadas aduana",
           "dinero no declarado aeropuerto", "migración irregular", "nuevos requisitos de visa", "exigencia de visa", "notificación roja Interpol",
           "migrantes interceptados", "pasaportes falsos detenido", "pasaporte falso aeropuerto", "red de falsificación de documentos",
           "tráfico de migrantes detenidos", "visas falsas detenidos", "trata de personas aeropuerto"]
      fr: ["cocaïne saisie aéroport", "mule cocaïne interpellée", "migration irrégulière", "obligation de visa", "notice rouge Interpol", "faux passeports interpellé", "passeport falsifié aéroport", "filière d'immigration clandestine démantelée",
           "fraude documentaire aéroport"]
      pt: ["cocaína apreendida aeroporto", "contêiner cocaína apreendido", "migração irregular", "exigência de visto", "difusão vermelha Interpol", "passaportes falsos preso", "passaporte falso aeroporto", "tráfico de migrantes preso"]
      nl: ["cocaïne onderschept haven", "bolletjesslikker Schiphol", "vals paspoort aangehouden", "mensensmokkel aangehouden",
           "mensenhandel", "Curaçao cocaïne", "Aruba drugs aangehouden", "Sint Maarten douane", "Suriname cocaïne"]
      de: ["Kokain sichergestellt Hafen", "Schleuser festgenommen", "gefälschter Reisepass Flughafen", "Menschenhandel festgenommen",
           "Drogenkurier Flughafen", "Bundespolizei Flughafen festgenommen"]
      it: ["cocaina sequestrata porto", "scafisti arrestati", "passaporto falso aeroporto", "tratta di esseri umani arresti",
           "ovuli di cocaina aeroporto", "Guardia di Finanza cocaina"]

  gdelt:                 # a free global news index; no key needed
    enabled: true
    queries:
      - '"fake passports"'
      - '"forged passport"'
      - '"fraudulent passport"'
      - '"passport fraud"'
      - '"visa fraud"'
      - '"migrant smuggling"'
      - '"human smuggling" airport'
      - '"fraudulent documents" immigration'
      - '"citizenship by investment"'
      - '"irregular migration"'
      - '"visa requirement"'
      - '"visa-free"'
      - '"Interpol" "red notice"'
      - '"citizenship" fraud'
      - '"deportees" Jamaica'
      - 'Jamaica immigration'
      - 'cocaine airport seized'
      - '"drug mule"'
      - 'firearms Jamaica seized'
      - '"undeclared cash"'
      - 'stowaway'
      - 'cocaine container port'

  # Add RSS feeds from agencies you trust (press-release pages that offer RSS).
  # Example:  - {name: "Agency name", url: "https://example.org/news/rss"}
  rss_feeds: []

  # Official press releases, read first on every run and marked OFFICIAL on the site.
  # type: rss (an RSS/Atom feed) or page (a news page without RSS: links whose address contains link_contains).
  # Every release still has to match a topic to be kept (most police news is not border related).
  # Checked from GitHub on 2026-11-26. Not reachable: INTERPOL and US Coast Guard (block automated readers),
  # Jamaica Customs (security certificate error), CARICOM IMPACS (no news page found). INTERPOL news still
  # arrives through Google News and is marked official (official_publishers below).
  official_feeds:
    - {name: "PICA (Jamaica)", url: "https://www.pica.gov.jm/rss.xml", country: "Jamaica"}
    - {name: "Jamaica Constabulary Force", url: "https://jcf.gov.jm/feed/", country: "Jamaica"}
    - {name: "Jamaica Information Service", url: "https://jis.gov.jm/feed/", country: "Jamaica"}
    - {name: "US Customs and Border Protection", url: "https://www.cbp.gov/rss/newsroom/media-releases", country: "United States"}
    - {name: "US Department of Justice", url: "https://www.justice.gov/news/rss?type=press_release", country: "United States"}
    - {name: "UK Border Force", url: "https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=border-force", country: "United Kingdom"}
    - {name: "UK Home Office", url: "https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=home-office", country: "United Kingdom"}
    - {name: "UK National Crime Agency", url: "https://www.nationalcrimeagency.gov.uk/news?format=feed&type=rss", country: "United Kingdom"}
    - {name: "Canada Border Services Agency", url: "https://api.io.canada.ca/io-server/gc/news/en/v2?dept=canadaborderservicesagency&type=newsreleases&sort=publishedDate&orderBy=desc&pick=50&format=atom&atomtitle=CBSA", country: "Canada"}
    - {name: "Europol", url: "https://www.europol.europa.eu/rss.xml", country: "European Union"}
    - {name: "Frontex", type: page, url: "https://www.frontex.europa.eu/media-centre/news/news-release/", link_contains: "/media-centre/news/news-release/", country: "European Union"}
    - {name: "US Immigration and Customs Enforcement", type: page, url: "https://www.ice.gov/newsroom", link_contains: "/news/releases/", country: "United States"}
    - {name: "US Department of Homeland Security", type: page, url: "https://www.dhs.gov/news-releases/press-releases", link_contains: "/news/20", country: "United States"}
    - {name: "IOM (UN migration agency)", type: page, url: "https://www.iom.int/news", link_contains: "/news/", country: ""}
    - {name: "UNODC", type: page, url: "https://www.unodc.org/unodc/en/press/allpress.html", link_contains: "/press/releases/", country: ""}
    - {name: "UK Visas and Immigration", url: "https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=uk-visas-and-immigration", country: "United Kingdom"}
    - {name: "EU Migration and Home Affairs", url: "https://home-affairs.ec.europa.eu/node/2/rss_en", country: "European Union"}
    # Embassies, high commissions, consulates and foreign ministries (kind: mission). They show under
    # "Official Updates > Embassies & high commissions". Only border-related releases are kept.
    - {name: "US Department of State (travel advisories)", kind: mission, title_only: true, url: "https://travel.state.gov/_res/rss/TAsTWs.xml", country: "United States"}
    - {name: "UK government in the Caribbean", kind: mission, url: "https://www.gov.uk/search/news-and-communications.atom?world_locations%5B%5D=jamaica&world_locations%5B%5D=barbados&world_locations%5B%5D=trinidad-and-tobago&world_locations%5B%5D=the-bahamas&world_locations%5B%5D=guyana&world_locations%5B%5D=haiti&world_locations%5B%5D=dominican-republic&world_locations%5B%5D=belize", country: "United Kingdom"}
    - {name: "UK Foreign Office (FCDO)", kind: mission, url: "https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=foreign-commonwealth-development-office", country: "United Kingdom"}
    - {name: "Global Affairs Canada", kind: mission, url: "https://api.io.canada.ca/io-server/gc/news/en/v2?dept=departmentofforeignaffairstradeanddevelopment&type=newsreleases&sort=publishedDate&orderBy=desc&pick=50&format=atom&atomtitle=GAC", country: "Canada"}
    - {name: "Dominican Republic Foreign Ministry (MIREX)", kind: mission, url: "https://mirex.gob.do/feed/", country: "Dominican Republic"}
    - {name: "Consulate General of Jamaica, Toronto", kind: mission, url: "https://www.jcgtoronto.ca/feed/", country: "Jamaica"}
  # Embassies, high commissions and foreign ministries with no feed that GitHub can read (checked 2026-11-27 with the
  # check-sources workflow: US embassies, India, Japan, Jamaica MFAFT and most Jamaican missions abroad block or have no feed).
  # They are searched once per run through Google News (US English edition).
  #   own_site: true  -> a site: search of the mission's own website: results are marked OFFICIAL (Embassies & high commissions)
  #   own_site: false -> a search by mission name: results are ordinary news about the mission
  # Every result must still match a border topic to be kept.
  mission_searches:
    - {name: "U.S. Embassy Kingston", own_site: true, country: "United States", query: "site:jm.usembassy.gov"}
    - {own_site: true, country: "United States", query: "site:bb.usembassy.gov OR site:tt.usembassy.gov OR site:bs.usembassy.gov OR site:ht.usembassy.gov OR site:do.usembassy.gov OR site:gy.usembassy.gov OR site:bz.usembassy.gov"}
    - {name: "Ministry of Foreign Affairs and Foreign Trade (Jamaica)", own_site: true, country: "Jamaica", query: "site:mfaft.gov.jm"}
    - {own_site: true, country: "Jamaica", query: "site:embassyofjamaica.org OR site:jhcuk.com OR site:jamaicacgny.org OR site:jamaicacgmiami.org OR site:jhcottawa.ca OR site:jcgtoronto.ca"}
    - {name: "Chinese Embassy in Jamaica", own_site: true, country: "China", query: "site:jm.china-embassy.gov.cn"}
    - {name: "High Commission of India, Kingston", own_site: true, country: "India", query: "site:hcikingston.gov.in"}
    - {name: "Canadian High Commission (Global Affairs Canada)", own_site: true, country: "Canada", query: "site:international.gc.ca Jamaica"}
    - {name: "EU Delegation (EEAS)", own_site: true, country: "European Union", query: "site:eeas.europa.eu Jamaica OR Caribbean"}
    - {own_site: true, country: "Cuba", query: "site:misiones.cubaminrex.cu OR site:cubaminrex.cu Jamaica OR Caribbean"}
    - {own_site: true, country: "Nigeria", query: "site:foreignaffairs.gov.ng"}
    - {own_site: true, country: "Venezuela", query: "site:mppre.gob.ve Jamaica OR Caribe"}
    - {own_site: true, country: "Japan", query: "site:jamaica.emb-japan.go.jp OR site:mofa.go.jp Jamaica"}
    - {query: '"High Commission" Jamaica'}
    - {query: 'embassy Jamaica visa OR passport OR deportees OR immigration OR consular'}
    - {query: '"Jamaican Embassy" OR "Jamaican High Commission" OR "Jamaican Consulate" OR "Jamaica Consulate"'}
    - {query: '"Ministry of Foreign Affairs and Foreign Trade" Jamaica'}
  # News-search results from these publishers come from a mission itself: marked OFFICIAL (Embassies & high commissions).
  mission_publishers: ["U.S. Embassy in Jamaica (.gov)", "MFAFT Jamaica", "Consulate General of Jamaica, Miami",
                       "High Commission of India, Kingston, Jamaica", "European External Action Service (EEAS)", "EEAS",
                       "Global Affairs Canada", "Chinese Embassy in Jamaica", "China Ministry of Foreign Affairs",
                       "Ministry of Foreign Affairs of Japan"]
  # Publisher names shown in another script are given an English name.
  publisher_rename: {"驻牙买加大使馆": "Chinese Embassy in Jamaica", "中华人民共和国外交部": "China Ministry of Foreign Affairs"}
  # News-search results from these publishers are also marked official.
  official_publishers: ["INTERPOL", "Frontex", "Europol", "U.S. Customs and Border Protection (.gov)", "CBP.gov",
                        "GOV.UK", "Jamaica Information Service", "JIS", "Jamaica Constabulary Force", "PICA",
                        "Jamaica Customs Agency", "U.S. Immigration and Customs Enforcement (.gov)", "ICE.gov",
                        "Department of Justice (.gov)", "justice.gov", "National Crime Agency", "UNODC", "IOM",
                        "Government of Canada", "canada.ca", "dhs.gov", "Homeland Security (.gov)", "travel.state.gov", "U.S. Department of State (.gov)", "state.gov"]

risk:
  # Only incidents (crimes) are scored. Policy, security and deportation news is shown as "Update".
  # Each indicator adds points when its words appear in the headline or summary.
  # Words match whole words; a word ending in * also matches longer forms (laminat* = laminator, laminating).
  # Indicators describe the event, never a person's nationality or background.
  # A high score means "worth a closer look", not proof.
  bands: {high: 40, medium: 20}       # score >= 40 = High, >= 20 = Medium, else Low
  indicators:
    organised_network:
      label: "Organised network or ring"
      points: 15
      words: ["syndicate", "ring", "racket", "network", "gang", "smuggling cell", "cartel", "organised crime", "organized crime",
              "red criminal", "banda", "organización criminal", "réseau", "filière", "quadrilha", "organização criminosa"]
    document_factory:
      label: "Document factory or forging equipment"
      points: 20
      words: ["factory", "printing equipment", "laminat*", "forging equipment", "blank passports", "stolen blank",
              "document lab", "holograms", "taller de falsificación", "imprenta", "atelier", "fábrica de documentos"]
    insider:
      label: "Possible insider or corruption"
      points: 15
      words: ["bribe*", "corrupt*", "insider", "baggage handler*", "airport worker*", "airport employee*", "airline employee*", "port worker*", "dock worker*", "customs officer arrested", "immigration officer arrested", "official arrested", "officials arrested",
              "employee arrested", "soborno", "funcionario", "corruption", "propina"]
    impostor:
      label: "Impostor or look-alike use of a genuine document"
      points: 15
      words: ["impostor", "imposter", "look-alike", "lookalike", "someone else's passport", "another person's passport",
              "belonging to another", "suplantación", "usurpation d'identité"]
    trafficking:
      label: "Exploitation or trafficking indicators"
      points: 15
      words: ["human trafficking", "trafficked", "people trafficking", "exploitation", "forced labour", "forced labor", "victims", "trata",
              "traite", "tráfico de pessoas"]
    wanted_person:
      label: "Wanted person or INTERPOL notice"
      points: 15
      words: ["red notice", "interpol", "fugitive", "wanted", "watch list", "watchlist", "extradit*",
              "notificacion roja", "notice rouge"]
    concealment:
      label: "Concealment method (body, luggage, cargo)"
      points: 15
      words: ["swallowed", "swallowing", "swallower*", "pellets", "body pack*", "body-pack*", "internal concealment", "strapped to",
              "hidden in", "concealed in", "false bottom", "suitcase lining", "secret compartment", "in his luggage",
              "in her luggage", "inside a container", "among a shipment", "rip-on", "rip-off", "oculta*", "escondid*",
              "dissimule*", "engolid*"]
    cargo_red_flags:
      label: "Cargo red flags (misdeclared, front company, transshipment)"
      points: 15
      words: ["misdeclar*", "mis-declar*", "falsely declared", "false declaration", "front company", "shell company",
              "free zone", "transshipment", "trans-shipment", "declared as", "manifested as", "falsa declaracion"]
    weapons:
      label: "Weapons involved"
      points: 10
      words: ["firearm*", "gun", "guns", "pistol*", "rifle*", "ammunition", "explosive*", "armas", "armes"]
    terrorism:
      label: "Terrorism link"
      points: 20
      words: ["terror*", "foreign fighter*", "ISIS", "Islamic State", "al-Qaeda", "extremist*"]
    transit:
      label: "Transit or onward route"
      points: 10
      words: ["transit", "en route to", "bound for", "connecting flight", "onward", "stopover", "en tránsito",
              "con destino a", "à destination de", "com destino a"]
    investment_citizenship:
      label: "Citizenship or residence by investment"
      points: 10
      words: ["citizenship by investment", "golden passport", "golden visa", "economic citizenship", "cbi programme",
              "cbi program"]
    digital:
      label: "Digital, biometric or e-visa fraud"
      points: 10
      words: ["morphing", "deepfake", "e-visa", "evisa", "esta application", "eta application", "biometric", "online visa", "fake website"]
    airport:
      label: "Detected at an airport or border post"
      points: 5
      words: ["airport", "aeropuerto", "aéroport", "aeroporto", "border post", "port of entry", "immigration counter",
              "check-in"]
  # extra points for scale
  many_documents: {threshold: 5, points: 10, big_threshold: 50, big_points: 20}
  many_people: {threshold: 10, points: 10}
  # extra points for weight (drugs, cash, goods), in kilograms
  weight: {threshold_kg: 10, points: 10, big_threshold_kg: 500, big_points: 20}

analysis:
  trend_days: 7          # "this week" compared with ...
  baseline_weeks: 4      # ... the average of the 4 weeks before
