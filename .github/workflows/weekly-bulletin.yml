# Every Monday: makes the weekly bulletin PDF from the live site and emails it to the team.
name: weekly-bulletin

on:
  schedule:
    - cron: "0 12 * * 1"     # Mondays at 12:00 UTC = 07:00 in Jamaica (after the daily run at 06:00)
  workflow_dispatch:          # "Run workflow" button, to send it again by hand

permissions:
  contents: write

concurrency:
  group: border-watch-osint
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Make the PDF and email it to the team
        run: python -u tools/send_weekly.py
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Save the PDF
        run: |
          git config user.name  "border-watch-osint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/bulletin.pdf
          git diff --cached --quiet || git commit -m "Weekly bulletin sent $(date -u +%F)"
          git push || (git pull --rebase -X theirs origin main && git push)
