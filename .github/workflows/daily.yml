# Runs the watch automatically on GitHub's free computers and saves the results.
name: daily-border-watch-osint

on:
  schedule:
    - cron: "0 11 * * *"     # every day at 11:00 UTC = 06:00 in Jamaica
  workflow_dispatch:          # adds a "Run workflow" button so you can run it by hand
    inputs:
      days:
        description: "How many days back to search (use 30 for the very first run)"
        default: "2"
      official_only:
        description: "Only read official press releases (skip the news search), e.g. when Google is limiting requests"
        type: boolean
        default: false

permissions:
  contents: write             # lets the job save the updated data and website

concurrency:
  group: border-watch-osint
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Search the news, analyse and rebuild the website
        run: python -u run.py --days "${{ github.event.inputs.days || '2' }}" ${{ github.event.inputs.official_only == 'true' && '--official-only' || '' }}
        env:                  # email settings for alerts (kept as secrets; nothing is sent until they are added)
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_ALERTS_TO: ${{ secrets.MAIL_ALERTS_TO }}
      - name: Save the results
        run: |
          git config user.name  "border-watch-osint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push || (git pull --rebase -X theirs origin main && git push)
