# Every Monday: builds the DRAFT weekly bulletin and emails it to the reviewer only.
# The team gets it only after the reviewer presses "Run workflow" on "send-bulletin" (the daily reports themselves go
# live automatically; only this bulletin waits for the reviewer).
name: weekly-bulletin

on:
  schedule:
    - cron: "0 12 * * 1"     # Mondays at 12:00 UTC = 07:00 in Jamaica (after the daily run at 06:00)
  workflow_dispatch:          # "Run workflow" button, to make a draft by hand

permissions:
  contents: read

concurrency:
  group: border-watch-osint
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build the draft bulletin
        run: python -u run.py --rebuild --draft --bulletin-date "$(date -u +%F)"
      - name: Email the draft to the reviewer
        run: BULLETIN_DATE="$(date -u +%F)" python -u tools/send_weekly.py --draft
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_ALERTS_TO: ${{ secrets.MAIL_ALERTS_TO }}
          MAIL_REVIEW_TO: ${{ secrets.MAIL_REVIEW_TO }}
