# Optional: press "Run workflow" to rebuild the live site now (for example right after editing reviews.yaml)
# instead of waiting for the next morning's run. Today's alerts that have not gone out yet are emailed.
name: publish

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: border-watch-osint
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rebuild the live site with the latest reviews.yaml
        run: python -u run.py --rebuild --publish
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_ALERTS_TO: ${{ secrets.MAIL_ALERTS_TO }}
      - name: Save
        run: |
          git config user.name  "border-watch-osint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Rebuild $(date -u +%F)"
          git push || (git pull --rebase -X theirs origin main && git push)
