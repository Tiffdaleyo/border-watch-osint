# Runs the watch every morning, updates the live site and sends alert emails. Nothing waits for a review:
# reports listed in reviews.yaml get the "Reviewed" mark, the rest show as automatically collected.
name: daily-border-watch-osint

on:
  schedule:
    - cron: "17 10 * * *"    # 10:17 UTC = 05:17 in Jamaica (GitHub often starts scheduled runs late, so start early)
    - cron: "17 12 * * *"    # back-up: 07:17 in Jamaica, runs only if the morning run has not happened yet
    - cron: "17 15 * * *"    # second back-up: 10:17 in Jamaica, same rule
  workflow_dispatch:          # adds a "Run workflow" button so you can run it by hand
    inputs:
      days:
        description: "How many days back to search (use 30 for the very first run)"
        default: "2"
      official_only:
        description: "Only read official press releases (skip the news search), e.g. when Google is limiting requests"
        type: boolean
        default: false

permissions:
  contents: write             # lets the job save the updated data and website

concurrency:
  group: border-watch-osint
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Skip if today's collection already ran (back-up start times)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && git log --since="$(date -u +%F)T00:00:00Z" --format=%s | grep -q "^Daily update"; then
            echo "Today's collection already ran; nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'
      - name: Search the news, analyse and rebuild the website
        if: steps.guard.outputs.skip != 'true'
        run: python -u run.py --days "${{ github.event.inputs.days || '2' }}" ${{ github.event.inputs.official_only == 'true' && '--official-only' || '' }}
        env:                  # email settings for alerts (kept as secrets; nothing is sent until they are added)
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_ALERTS_TO: ${{ secrets.MAIL_ALERTS_TO }}
      - name: Save the results
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "border-watch-osint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push || (git pull --rebase -X theirs origin main && git push)
